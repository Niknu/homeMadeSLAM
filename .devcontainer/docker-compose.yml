services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    container_name: ros_container
    environment:
      HOME: /home/ubuntu
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
      XDG_RUNTIME_DIR: /tmp/xdg
      QT_QPA_PLATFORM: wayland
      ELECTRON_OZONE_PLATFORM_HINT: wayland
      # ${XDG_RUNTIME_DIR} is mounted at /tmp/xdg, so the session bus lives there
      DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/xdg/bus
    cap_add:
      - SYS_ADMIN
    volumes:
      - ../:/workspace
      # wayland socket
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/tmp/xdg
      # xserver
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # clangd background index, so it survives container recreation
      - clangd-index:/home/ubuntu/.cache/clangd
    working_dir: /workspace
    # Electron/Chromium needs more than the default 64 MB /dev/shm
    shm_size: "1gb"
    tty: false
    stdin_open: false
    command: sleep infinity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [all]

volumes:
  clangd-index:
